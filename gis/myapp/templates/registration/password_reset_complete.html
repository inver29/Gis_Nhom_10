{% extends "base.html" %}
{% block title %}Đổi mật khẩu thành công{% endblock %}
{% block body_class %}site-page login-page{% endblock %}

{% block content_wrapper %}
<div class="auth-layout">
    <div class="container">
        <div class="auth-shell" style="grid-template-columns:minmax(0,1fr);max-width:760px;margin:0 auto;">
            <section class="content-card auth-card text-center">
                <h2>Mật khẩu đã được cập nhật</h2>
                <p>Bạn có thể đăng nhập lại bằng mật khẩu mới ngay bây giờ.</p>
                <a href="{% url 'login' %}" class="pharma-btn" style="max-width:240px;margin:0 auto;">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Đăng nhập</span>
                </a>
            </section>
        </div>
    </div>
</div>
{% endblock %}
