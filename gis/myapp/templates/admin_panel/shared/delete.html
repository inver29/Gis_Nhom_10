{% extends "admin_panel/base.html" %}

{% block admin_content %}
<section class="admin-surface admin-section" style="max-width: 760px;">
    <div class="admin-section-head">
        <div>
            <h2 class="text-danger">Xác nhận xóa {{ title }}</h2>
            <p>Hành động này không thể hoàn tác. Hãy chắc chắn rằng bạn muốn xóa dữ liệu trước khi tiếp tục.</p>
        </div>
    </div>

    <div class="admin-danger-box mb-4">
        <strong>Dữ liệu sẽ bị xóa:</strong>
        <div class="mt-2">{{ object_name }}</div>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="admin-toolbar">
            <button type="submit" class="btn-admin btn-admin-danger">
                <i class="fas fa-trash"></i>
                <span>Xác nhận xóa</span>
            </button>
            <a href="{% if model_key == 'order' %}{% url 'custom_admin_order_detail' object.pk %}{% else %}{% url 'custom_admin_list' model_key %}{% endif %}" class="btn-admin btn-admin-light">
                <i class="fas fa-arrow-left"></i>
                <span>Quay lại</span>
            </a>
        </div>
    </form>
</section>
{% endblock %}
